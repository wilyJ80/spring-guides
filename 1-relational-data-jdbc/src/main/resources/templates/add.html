<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Add Customer</title>
</head>

<body>

	<form th:action="@{/add}" th:object="${customer}" method="post">
		<input th:field="*{firstName}" placeholder="First Name" required autofocus>
		<input th:field="*{lastName}" placeholder="Last Name" required>
		<button>Submit</button>
	</form>

</body>

</html>
